[package]
name = "docker-watchdog"
version = "0.1.0"
edition = "2024"

[dependencies]
bollard = "0.20.1"
futures-util = "0.3.32"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
